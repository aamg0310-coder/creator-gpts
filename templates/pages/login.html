{% extends "base.html" %}

{% block title %}Iniciar Sesión — GPT Creator{% endblock %}

{% block content %}
<div style="max-width: 400px; margin: 0 auto; padding-top: var(--space-2xl);">
  <div style="text-align: center; margin-bottom: var(--space-xl);">
    <div style="margin-bottom: var(--space-md); color: var(--accent);">
      <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" x2="3" y1="12" y2="12"/></svg>
    </div>
    <h1 style="font-size: 1.4rem; font-weight: 600; margin-bottom: var(--space-xs);">Iniciar Sesión</h1>
    <p style="color: var(--text-secondary); font-size: 0.9rem;">Bienvenido de vuelta</p>
  </div>

  <form method="post" class="card">
    {% csrf_token %}

    <div class="form-group">
      <label class="form-label" for="id_username">Usuario o correo</label>
      <input type="text" name="username" id="id_username" class="form-input"
             placeholder="tu_usuario" required autofocus>
    </div>

    <div class="form-group">
      <label class="form-label" for="id_password">Contraseña</label>
      <input type="password" name="password" id="id_password" class="form-input"
             placeholder="••••••••" required>
    </div>

    <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: var(--space-sm);">
      Entrar
    </button>

    <p style="text-align: center; margin-top: var(--space-lg); font-size: 0.85rem;">
      <span style="color: var(--text-secondary);">¿No tienes cuenta?</span>
      <a href="{% url 'register' %}" style="font-weight: 500;">Regístrate aquí</a>
    </p>
  </form>
</div>
{% endblock %}
