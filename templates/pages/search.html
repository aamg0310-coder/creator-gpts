{% extends "base.html" %}

{% block title %}Buscar — GPT Creator{% endblock %}

{% block content %}
<div style="max-width: 900px; margin: 0 auto; padding: 0 var(--space-md);">
  <h1 style="font-size: 1.5rem; font-weight: 600; margin-bottom: var(--space-xl);">Buscar Chatbots</h1>

  <div class="form-group">
    <div style="position: relative;">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%);"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input type="text" id="search-input" class="form-input" placeholder="Buscar chatbots públicos..."
             autofocus style="padding-left: 40px;">
    </div>
  </div>

  <div class="card-grid" id="search-results">
    <p class="text-secondary" style="grid-column:1/-1;text-align:center; padding: var(--space-2xl);">
      Escribe para buscar chatbots públicos.
    </p>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
  const searchInput = document.getElementById('search-input');
  const resultsDiv = document.getElementById('search-results');

  searchInput.addEventListener('input', function() {
    const q = this.value.trim();
    if (q.length < 2) {
      resultsDiv.innerHTML = '<p class="text-secondary" style="grid-column:1/-1;text-align:center; padding: var(--space-2xl);">Escribe al menos 2 caracteres.</p>';
      return;
    }
    fetch(`/api/chatbots/?search=${encodeURIComponent(q)}`)
      .then(r => r.json())
      .then(data => {
        const results = data.results || data;
        if (!results.length) {
          resultsDiv.innerHTML = '<p class="text-secondary" style="grid-column:1/-1;text-align:center; padding: var(--space-2xl);">No se encontraron chatbots.</p>';
          return;
        }
        resultsDiv.innerHTML = results.map(cb => `
          <div class="card">
            <div class="card-header">
              <div class="card-title">${cb.icon ? '<img src="'+cb.icon.replace(/"/g, '&quot;')+'" style="width:28px;height:28px;border-radius:50%;object-fit:cover;vertical-align:middle;margin-right:6px;">' : '🤖'} ${cb.nombre.replace(/</g, '&lt;')}</div>
              <span class="badge badge-accent">${cb.modelo_display}</span>
            </div>
            <p class="card-description">${(cb.descripcion || 'Sin descripción').replace(/</g, '&lt;')}</p>
            <div style="margin-top:var(--space-lg);">
              <a href="/${cb.slug}/" class="btn btn-primary btn-sm">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                Chatear
              </a>
            </div>
          </div>
        `).join('');
      });
  });
</script>
{% endblock %}
