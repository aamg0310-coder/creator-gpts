{% extends "base.html" %}
{% load static %}

{% block title %}GPT Creator — Plataforma de Chatbots IA{% endblock %}

{% block content %}
<div class="home-chat">
  <!-- Logo & Title -->
  <div class="home-header">
    <div class="home-logo">
      <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/></svg>
    </div>
    <h1 class="home-title">GPT Creator</h1>
    <p class="home-subtitle">¿Qué te gustaría hacer hoy?</p>
  </div>

  <!-- Chat Input -->
  <div class="home-chat-input-wrapper">
    {% csrf_token %}
    <div class="home-chat-input-box">
      <input type="text" id="home-chat-input" class="home-chat-input"
             placeholder="Pregúntame lo que quieras sobre la plataforma..."
             autocomplete="off">
      <button type="button" id="home-send-btn" class="home-send-btn">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 7-7 7 7"/><path d="M12 19V5"/></svg>
      </button>
    </div>
  </div>

  <!-- Quick Suggestions -->
  <div class="home-suggestions">
    <button class="suggestion-chip" data-action="my_chatbots">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      Ver mis chatbots
    </button>
    <button class="suggestion-chip" data-action="create_chatbot">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
      Crear nuevo chatbot
    </button>
    <button class="suggestion-chip" data-action="search">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      Buscar chatbots
    </button>
    {% if not user.is_authenticated %}
    <button class="suggestion-chip" data-action="register">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" x2="19" y1="8" y2="14"/><line x1="22" x2="16" y1="11" y2="11"/></svg>
      Crear cuenta
    </button>
    {% endif %}
  </div>

  <!-- Chat Messages Area (hidden initially) -->
  <div class="home-chat-messages" id="home-chat-messages" style="display: none;"></div>
</div>

<style>
  .home-chat {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: calc(100vh - 120px);
    padding: var(--space-xl);
  }

  .home-header {
    text-align: center;
    margin-bottom: var(--space-2xl);
  }

  .home-logo {
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: var(--space-lg);
    color: var(--accent);
  }

  .home-title {
    font-size: 2.2rem;
    font-weight: 700;
    color: var(--text-primary);
    margin-bottom: var(--space-sm);
  }

  .home-subtitle {
    font-size: 1.05rem;
    color: var(--text-secondary);
  }

  .home-chat-input-wrapper {
    width: 100%;
    max-width: 640px;
    margin-bottom: var(--space-xl);
  }

  .home-chat-input-box {
    display: flex;
    align-items: center;
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: var(--space-sm);
    transition: var(--transition);
  }

  .home-chat-input-box:focus-within {
    border-color: var(--accent);
    box-shadow: var(--shadow-glow);
  }

  .home-chat-input {
    flex: 1;
    padding: 0.8rem 1rem;
    background: transparent;
    border: none;
    color: var(--text-primary);
    font-family: var(--font-family);
    font-size: 1rem;
    outline: none;
  }

  .home-chat-input::placeholder {
    color: var(--text-muted);
  }

  .home-send-btn {
    width: 40px;
    height: 40px;
    border-radius: var(--radius-md);
    background: var(--accent);
    color: white;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: var(--transition);
    flex-shrink: 0;
  }

  .home-send-btn:hover {
    background: var(--accent-hover);
  }

  .home-suggestions {
    display: flex;
    flex-wrap: wrap;
    gap: var(--space-sm);
    justify-content: center;
    max-width: 640px;
  }

  .suggestion-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 0.6rem 1rem;
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: var(--radius-full);
    color: var(--text-secondary);
    font-family: var(--font-family);
    font-size: 0.85rem;
    font-weight: 500;
    cursor: pointer;
    transition: var(--transition);
    white-space: nowrap;
  }

  .suggestion-chip:hover {
    background: var(--bg-hover);
    color: var(--text-primary);
    border-color: var(--accent);
  }

  .suggestion-chip svg {
    width: 14px;
    height: 14px;
    opacity: 0.6;
  }

  /* Chat messages in home */
  .home-chat-messages {
    width: 100%;
    max-width: 640px;
    margin-top: var(--space-xl);
  }

  .home-chat .chat-message {
    max-width: 100%;
  }

  .home-chat .chat-message.user .chat-bubble {
    background: var(--accent);
    color: white;
  }

  .home-chat .chat-message.assistant .chat-bubble {
    background: var(--bg-secondary);
    color: var(--text-primary);
  }

  @media (max-width: 768px) {
    .home-title { font-size: 1.6rem; }
    .home-subtitle { font-size: 0.95rem; }
    .home-suggestions { flex-direction: column; align-items: center; }
    .suggestion-chip { width: 100%; justify-content: center; }
    .home-chat { padding: var(--space-lg) var(--space-md); min-height: calc(100vh - 100px); }
    .home-chat-input { font-size: 16px; } /* Prevent iOS zoom */
  }

  @media (max-width: 480px) {
    .home-title { font-size: 1.4rem; }
    .home-subtitle { font-size: 0.85rem; }
    .home-logo svg { width: 32px; height: 32px; }
  }
</style>

{% endblock %}

{% block extra_js %}
<script>
  // Suggestion chips
  document.querySelectorAll('.suggestion-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      const action = chip.dataset.action;
      const urls = {
        'my_chatbots': '{% url "my_chatbots" %}',
        'create_chatbot': '{% url "create_chatbot" %}',
        'search': '{% url "search" %}',
        'register': '{% url "register" %}',
        'login': '{% url "login" %}'
      };
      if (urls[action]) window.location.href = urls[action];
    });
  });

  // Concierge chat (real backend via /api/home/ask/)
  const csrfToken = '{{ csrf_token }}';
  const homeChatInput = document.getElementById('home-chat-input');
  const homeSendBtn = document.getElementById('home-send-btn');
  const homeMessages = document.getElementById('home-chat-messages');

  function addHomeMessage(text, role) {
    const div = document.createElement('div');
    div.className = `chat-message ${role}`;
    const icon = role === 'user'
      ? '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>'
      : '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/></svg>';
    div.innerHTML = `
      <div class="chat-avatar">${icon}</div>
      <div class="chat-bubble">${role === 'assistant' ? renderMarkdown(text) : text.replace(/</g, '&lt;').replace(/\n/g, '<br>')}</div>
    `;
    homeMessages.appendChild(div);
    homeMessages.scrollTop = homeMessages.scrollHeight;
  }

  function getCookie(name) {
    const v = document.cookie.match('(^|;) ?' + name + '=([^;]*)(;|$)');
    return v ? decodeURIComponent(v[2]) : '';
  }

  async function handleHomeChat() {
    const text = homeChatInput.value.trim();
    if (!text) return;

    homeMessages.style.display = 'flex';
    homeMessages.style.flexDirection = 'column';
    homeMessages.style.gap = 'var(--space-md)';
    document.querySelector('.home-header').style.display = 'none';
    document.querySelector('.home-suggestions').style.display = 'none';

    addHomeMessage(text, 'user');
    homeChatInput.value = '';

    try {
      const token = csrfToken || getCookie('csrftoken') || '';
      const resp = await fetch('/api/home/ask/', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-CSRFToken': token,
        },
        body: JSON.stringify({ question: text }),
      });
      if (!resp.ok) {
        const txt = await resp.text();
        console.error('Server error:', resp.status, txt.slice(0, 300));
        addHomeMessage('El asistente respondió con un error (código ' + resp.status + '). Si estás logueado, intenta recargar. Si no, inicia sesión.', 'assistant');
        return;
      }
      const data = await resp.json();
      if (data && data.answer) {
        addHomeMessage(data.answer, 'assistant');
      } else {
        addHomeMessage('No recibí una respuesta del asistente. Intenta de nuevo.', 'assistant');
      }
    } catch (err) {
      console.error('Fetch error:', err);
      addHomeMessage('No se pudo conectar con el asistente. Revisa que estés logueado o intenta recargar la página.', 'assistant');
    }
  }

  homeSendBtn.addEventListener('click', handleHomeChat);
  homeChatInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') handleHomeChat();
  });
</script>
{% endblock %}
