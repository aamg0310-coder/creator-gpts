{% extends "base.html" %}

{% block title %}Registrarse — GPT Creator{% endblock %}

{% block content %}
<div style="max-width: 440px; margin: 0 auto; padding-top: var(--space-2xl);">
  <div style="text-align: center; margin-bottom: var(--space-xl);">
    <div style="margin-bottom: var(--space-md); color: var(--accent);">
      <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" x2="19" y1="8" y2="14"/><line x1="22" x2="16" y1="11" y2="11"/></svg>
    </div>
    <h1 style="font-size: 1.4rem; font-weight: 600; margin-bottom: var(--space-xs);">Crear Cuenta</h1>
    <p style="color: var(--text-secondary); font-size: 0.9rem;">Empieza a crear chatbots increíbles</p>
  </div>

  <form method="post" class="card">
    {% csrf_token %}

    <div class="form-group">
      <label class="form-label" for="id_username">Nombre de usuario</label>
      <input type="text" name="username" id="id_username" class="form-input"
             placeholder="tu_usuario" required autofocus>
    </div>

    <div class="form-group">
      <label class="form-label" for="id_email">Correo electrónico</label>
      <input type="email" name="email" id="id_email" class="form-input"
             placeholder="correo@ejemplo.com" required>
    </div>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-md);" class="register-name-grid">
      <div class="form-group">
        <label class="form-label" for="id_first_name">Nombre</label>
        <input type="text" name="first_name" id="id_first_name" class="form-input"
               placeholder="Tu nombre">
      </div>

      <div class="form-group">
        <label class="form-label" for="id_last_name">Apellido</label>
        <input type="text" name="last_name" id="id_last_name" class="form-input"
               placeholder="Tu apellido">
      </div>
    </div>

    <div class="form-group">
      <label class="form-label" for="id_password">Contraseña</label>
      <input type="password" name="password" id="id_password" class="form-input"
             placeholder="Mínimo 8 caracteres" required minlength="8">
    </div>

    <div class="form-group">
      <label class="form-label" for="id_password_confirm">Confirmar contraseña</label>
      <input type="password" name="password_confirm" id="id_password_confirm" class="form-input"
             placeholder="Repite tu contraseña" required minlength="8">
    </div>

    <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: var(--space-sm);">
      Crear Cuenta
    </button>

    <p style="text-align: center; margin-top: var(--space-lg); font-size: 0.85rem;">
      <span style="color: var(--text-secondary);">¿Ya tienes cuenta?</span>
      <a href="{% url 'login' %}" style="font-weight: 500;">Inicia sesión</a>
    </p>
  </form>
</div>
{% endblock %}
